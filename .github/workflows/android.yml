# Builds the Android app (APK) and posts it as a GitHub release.
# Download the newest build from:
#   https://github.com/mrakempf/pencil-and-puzzle/releases/latest/download/pencil-and-puzzle.apk
name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'icons/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Optional: a permanent signing key stored as repository secrets (never in the code).
      # Without it each build is signed with a temporary key.
      - name: Use the saved signing key, if one has been added
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease -PversionCode=${{ github.run_number }}

      - name: Publish it as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk pencil-and-puzzle.apk
          gh release create "android-${{ github.run_number }}" pencil-and-puzzle.apk \
            --title "Android app, build ${{ github.run_number }}" \
            --notes "Install pencil-and-puzzle.apk on an Android phone. It loads https://mrakempf.github.io/pencil-and-puzzle/ so puzzles update without a new APK." \
            --latest
