<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Pencil &amp; Puzzle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- Home-screen app settings (iPhone "Add to Home Screen" and Android "Install app") -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pencil &amp; Puzzle">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e4ebe3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1517" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one spiral-bound "page" (max 780px) centered on a sage desk; tabs swap views in place, a puzzle takes over the page. */
:root{
  --desk:#e4ebe3; --paper:#fbfcf9; --ink:#1b2a31; --muted:#5a6a6e; --line:#d2dcd4; --ring:#9aa8a3;
  --pencil:#f2b705; --pencil-soft:#fcefbf; --sea:#1d6a72; --sea-soft:#dcebea;
  --red:#bf3f37; --red-soft:#f7dcd8; --good:#2b7f4e; --good-soft:#d9eee0; --peer:#eef3ee;
  --m1:rgba(242,183,5,.45); --m2:rgba(29,106,114,.32); --m3:rgba(191,63,55,.28); --m4:rgba(43,127,78,.32); --m5:rgba(120,80,170,.28); --m6:rgba(230,120,40,.32);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#0f1517; --paper:#172126; --ink:#e6ece8; --muted:#9caaa9; --line:#2c3a3f; --ring:#4d5c5d;
  --pencil:#f4c63a; --pencil-soft:#3d3516; --sea:#62b8bf; --sea-soft:#1d3539;
  --red:#ef7f75; --red-soft:#43211f; --good:#6cc38f; --good-soft:#1c3527; --peer:#1e2b30;
  --m1:rgba(244,198,58,.35); --m2:rgba(98,184,191,.32); --m3:rgba(239,127,117,.3); --m4:rgba(108,195,143,.3); --m5:rgba(170,140,230,.3); --m6:rgba(240,150,70,.32);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0f1517; --paper:#172126; --ink:#e6ece8; --muted:#9caaa9; --line:#2c3a3f; --ring:#4d5c5d;
  --pencil:#f4c63a; --pencil-soft:#3d3516; --sea:#62b8bf; --sea-soft:#1d3539;
  --red:#ef7f75; --red-soft:#43211f; --good:#6cc38f; --good-soft:#1c3527; --peer:#1e2b30;
  --m1:rgba(244,198,58,.35); --m2:rgba(98,184,191,.32); --m3:rgba(239,127,117,.3); --m4:rgba(108,195,143,.3); --m5:rgba(170,140,230,.3); --m6:rgba(240,150,70,.32);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--desk);color:var(--ink);font:16px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.page{max-width:780px;margin:0 auto;background:var(--paper);border-radius:6px 6px 10px 10px;box-shadow:0 1px 0 var(--line),0 12px 32px -18px rgba(0,0,0,.35);position:relative;padding:34px clamp(16px,4vw,36px) 32px;min-width:0}
.page::before{content:"";position:absolute;left:14px;right:14px;top:8px;height:14px;background:radial-gradient(circle at 50% 50%,var(--desk) 0 3.5px,var(--ring) 4px 5.5px,transparent 6px) repeat-x;background-size:20px 14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:clamp(26px,5vw,34px)}
.brand h1 em{font-style:normal;color:var(--pencil);-webkit-text-stroke:1px var(--ink);paint-order:stroke fill}
.rank{display:flex;align-items:center;gap:10px;background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-size:13px}
.rank b{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);font:800 13px var(--f-display);padding:0 4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.wallet{display:flex;align-items:center;gap:6px;background:var(--pencil-soft);border:1px solid var(--pencil);border-radius:999px;padding:5px 12px 5px 6px;font-size:13px}
.wallet .coin{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--pencil);color:#1b2a31;font:800 11px var(--f-display);box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.wallet b{font:800 16px var(--f-display);font-variant-numeric:tabular-nums}
.rank .bar{width:60px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.rank .bar i{display:block;height:100%;background:var(--pencil)}
.tabs{display:flex;gap:4px;margin:18px 0 22px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
@media (max-width:480px){.tabs button{padding:10px 9px}}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--pencil)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-block;font:700 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:999px;vertical-align:middle}
.d-easy{background:var(--good-soft);color:var(--good)}.d-medium{background:var(--sea-soft);color:var(--sea)}.d-hard{background:var(--pencil-soft);color:var(--ink)}.d-expert{background:var(--red-soft);color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:8px;padding:10px 18px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:6px 12px;font-size:14px}
.btn:hover{filter:brightness(1.12)}
.ic{display:inline-flex;width:22px;height:22px}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stack{display:grid;gap:22px}
.muted{color:var(--muted)}
.tip{font-size:13px;color:var(--muted)}

/* Today */
.daily{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;padding:22px;border:2px solid var(--ink);border-radius:10px;background:linear-gradient(var(--paper),var(--paper)) padding-box;position:relative}
.daily::after{content:"";position:absolute;right:-2px;top:-2px;width:44px;height:44px;background:linear-gradient(225deg,var(--pencil) 50%,transparent 50%);border-top-right-radius:10px}
.daily h2{font-size:clamp(28px,6vw,40px);margin-top:6px}
.daily .meta{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.daily .big-ic{width:76px;height:76px;color:var(--sea)}
@media (max-width:520px){.daily{grid-template-columns:1fr}.daily .big-ic{display:none}}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.panel{border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.panel h3{font-size:20px;margin:4px 0 10px}
.streak-n{font:800 44px/1 var(--f-display)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.day{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 0;display:grid;justify-items:center;gap:2px;font-size:12px;color:var(--muted)}
.day b{font:700 15px var(--f-body);color:var(--ink)}
.day.done{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.day.done b{color:var(--paper)}
.day.today{border:2px solid var(--pencil)}
.chbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:10px 0 14px}
.chbar i{display:block;height:100%;background:var(--sea)}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.qcard{display:grid;gap:6px;text-align:left;background:none;border:1px solid var(--line);border-radius:10px;padding:14px}
.qcard:hover{border-color:var(--ink)}
.qcard .ic{color:var(--sea)}
.qcard b{font-weight:700}
.qcard small{color:var(--muted);font-size:13px;line-height:1.35}
.qcard[aria-pressed="true"]{border:2px solid var(--ink);background:var(--pencil-soft);padding:13px}

/* Journey */
.chapter{border-top:1px dashed var(--line);padding-top:18px}
.chapter-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.chapter-head h3{font-size:22px}
.trail{position:relative;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,auto);row-gap:22px;margin:16px 0 8px}
.trail svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.trail svg.path path{fill:none;stroke:var(--ring);stroke-width:2;stroke-dasharray:6 6;vector-effect:non-scaling-stroke}
.node{position:relative;justify-self:center;display:grid;justify-items:center;gap:4px;background:none;border:0;padding:0}
.node .dot{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--ink);background:var(--paper);font:800 18px var(--f-display);position:relative}
.node .dot .ic{position:absolute;bottom:-6px;right:-6px;width:24px;height:24px;padding:3px;background:var(--paper);border:1.5px solid var(--ink);border-radius:50%}
.node.done .dot{background:var(--ink);color:var(--paper)}
.node.current .dot{background:var(--pencil);color:#1b2a31;box-shadow:0 0 0 6px var(--pencil-soft)}
.node.locked .dot{border-style:dashed;border-color:var(--ring);color:var(--muted)}
.node.locked .dot .ic{border-color:var(--ring);color:var(--muted)}
.node.boss .dot{border-radius:14px;transform:rotate(45deg)}
.node.boss .dot > span{transform:rotate(-45deg)}
.node.boss .dot .ic{transform:rotate(-45deg);bottom:auto;right:-14px;top:18px}
.stars{font-size:13px;letter-spacing:1px;color:var(--pencil);height:16px;line-height:16px}
.stars .off{color:var(--line)}
@media (prefers-reduced-motion:no-preference){.node.current .dot{animation:bob 2.4s ease-in-out infinite}}
@keyframes bob{50%{box-shadow:0 0 0 10px var(--pencil-soft)}}

/* Free play */
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{background:none;border:0;padding:8px 14px;font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* Progress */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:10px;padding:14px}
.stat b{display:block;font:800 30px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:130px 1fr 36px;gap:10px;align-items:center;font-size:14px}
.barrow .track{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.barrow .track i{display:block;height:100%;background:var(--sea)}
.barrow span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.xpbar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.xpbar i{display:block;height:100%;background:var(--pencil)}
.switch{display:flex;align-items:center;gap:10px;font-weight:600}
.switch input{width:20px;height:20px;accent-color:var(--sea)}

/* Play */
.play-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.play-head h2{font-size:clamp(24px,5vw,32px)}
.timer{font:600 20px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.back{background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:600}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 20px;align-items:center}
.tools .spacer{flex:1}
.tools .hints{font-size:13px;color:var(--muted)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}

/* Sudoku */
.sud-wrap{display:grid;gap:16px;justify-items:center}
.sud{display:grid;grid-template-columns:repeat(9,1fr);width:min(100%,468px);aspect-ratio:1;border:3px solid var(--ink);background:var(--paper)}
.sc{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;display:grid;place-items:center;font:600 clamp(17px,5.2vw,26px) var(--f-body);color:var(--sea);padding:0;min-width:0;min-height:0}
.sc.br{border-right:3px solid var(--ink)}.sc.bb{border-bottom:3px solid var(--ink)}.sc.endc{border-right:0}.sc.lr{border-bottom:0}
.sc.given{color:var(--ink);font-weight:800}
.sc.peer{background:var(--peer)}
.sc.same{background:var(--sea-soft)}
.sc.sel{background:var(--pencil-soft);box-shadow:inset 0 0 0 2px var(--pencil)}
.sc.bad{color:var(--red)}
.sc.wrong{background:var(--red-soft);color:var(--red)}
.sc.hinted{text-decoration:underline dotted;text-underline-offset:4px}
.nts{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:100%;padding:2px}
.nts i{font:500 clamp(8px,2vw,11px)/1 var(--f-body);font-style:normal;color:var(--muted);display:grid;place-items:center}
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;width:min(100%,468px)}
.pad button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 0 4px;font:700 20px var(--f-body);display:grid;justify-items:center;line-height:1.1}
.pad button small{font:500 10px var(--f-body);color:var(--muted);height:12px}
.pad button.done{opacity:.35}
.pad .tool{grid-column:span 3;font-size:15px;padding:10px 0}
.pad .tool[aria-pressed="true"]{background:var(--pencil-soft);border-color:var(--pencil)}

/* Word search */
.ws-wrap{display:grid;grid-template-columns:minmax(0,calc(var(--n)*34px)) minmax(180px,1fr);gap:22px;align-items:start}
@media (max-width:640px){.ws-wrap{grid-template-columns:minmax(0,1fr)}}
.ws-board{position:relative;width:min(100%,calc(var(--n)*34px));aspect-ratio:1;justify-self:center;border:2px solid var(--ink);border-radius:6px;user-select:none;-webkit-user-select:none;touch-action:none}
.ws{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr)}
.wc{display:grid;place-items:center;font:600 clamp(11px,3.3vw,18px) var(--f-body);cursor:pointer}
.wc.anchor{background:var(--pencil-soft);border-radius:50%}
.wc.flash{animation:flash 1s ease 3}
@keyframes flash{50%{background:var(--pencil);border-radius:50%}}
.ws-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ws-svg line{stroke-linecap:round;stroke-width:.72}
.ws-list{list-style:none;padding:0;margin:10px 0 12px;columns:2;column-gap:16px}
.ws-list li{padding:3px 0;font-weight:600}
.ws-list li.found{text-decoration:line-through;color:var(--muted);font-weight:400}

/* Word chain */
.wch{display:flex;gap:clamp(18px,6vw,48px);justify-content:center;flex-wrap:wrap}
.ladder{display:grid;gap:0;width:180px;border:2px solid var(--ink);border-radius:4px;overflow:hidden}
.rung{position:relative;display:flex;align-items:center;justify-content:center;height:58px;border-bottom:1px solid var(--line);clip-path:none}
.rung:last-child{border-bottom:0}
.rung.end{font:800 26px var(--f-display);letter-spacing:.08em}
.rung.end.done{background:var(--good-soft);color:var(--good)}
.rung input{width:120px;text-align:center;border:0;background:transparent;font:700 24px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--sea);padding:6px 0}
.rung::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:10px;border-left:1px solid var(--line);border-right:1px solid var(--line);opacity:.0}
.mk{position:absolute;right:10px;font-weight:800;font-size:16px;width:18px;text-align:center}
.mk.good{color:var(--good)}.mk.bad{color:var(--red)}
.rung.badrow input{color:var(--red)}

/* Cryptogram */
.cg{display:flex;flex-wrap:wrap;gap:16px 20px;padding:6px 0}
.cw{display:flex;gap:3px;align-items:flex-end}
.cl{display:flex;flex-direction:column;align-items:center;width:28px;gap:3px}
.cl input{width:28px;height:34px;text-align:center;border:0;border-bottom:2px solid var(--ink);border-radius:0;background:transparent;font:700 20px var(--f-body);text-transform:uppercase;color:var(--sea);padding:0}
.cl input:focus{background:var(--pencil-soft);outline:none}
.cl input.same{background:var(--sea-soft)}
.cl input.locked{color:var(--ink)}
.cl input.dup{color:var(--pencil);text-shadow:0 0 1px var(--ink)}
.cl input.wrong{color:var(--red);background:var(--red-soft)}
.cl span{font:500 12px var(--f-mono);color:var(--muted)}
.cp{font:700 20px var(--f-body);padding-bottom:20px}
.cg-author{margin-top:14px;font-style:italic;color:var(--muted)}
.abc{display:flex;flex-wrap:wrap;gap:4px;margin-top:18px}
.abc span{width:24px;height:24px;display:grid;place-items:center;font:600 12px var(--f-mono);border:1px solid var(--line);border-radius:4px}
.abc span.used{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* Scramble */
.scr{display:grid;gap:12px}
.scr-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,220px) 24px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
@media (max-width:520px){.scr-row{grid-template-columns:minmax(0,1fr) 24px}.scr-row .tiles{grid-column:1/-1}}
.tiles{display:flex;gap:4px;flex-wrap:wrap}
.tiles span{width:30px;height:34px;display:grid;place-items:center;border:1.5px solid var(--ink);border-radius:4px;font:800 18px var(--f-display);background:var(--paper);box-shadow:0 2px 0 var(--ink)}
.scr-row input{width:100%;border:0;border-bottom:2px solid var(--ink);background:transparent;font:700 20px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--sea);padding:6px 2px}
.scr-row.ok input{color:var(--good);border-color:var(--good)}
.scr-row .mk{position:static}

/* Logic grid */
.lg-intro{max-width:62ch;margin-bottom:14px}
.lg-scroll{overflow-x:auto;padding-bottom:6px;max-width:100%}
.lg{border-collapse:collapse;margin:0 auto}
.lg th{font-weight:600;font-size:12px;padding:0}
.lg .cat-h{font:800 13px var(--f-display);text-transform:uppercase;letter-spacing:.05em;padding:4px;border-bottom:2px solid var(--ink);text-align:center}
.lg .item-h{vertical-align:bottom;padding:4px 0;height:110px;border-left:1px solid var(--line)}
.lg .item-h span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;display:inline-block}
.lg .item-h.edge{border-right:2px solid var(--ink)}
.lg .cat-v{writing-mode:vertical-rl;transform:rotate(180deg);font:800 12px var(--f-display);text-transform:uppercase;letter-spacing:.05em;padding:0 4px;border-left:2px solid var(--ink);text-align:center}
.lg .item-v{text-align:right;padding:0 8px 0 4px;white-space:nowrap;border-top:1px solid var(--line);font-size:13px}
.lg tr.gstart .item-v,.lg tr.gstart td{border-top:2px solid var(--ink)}
.lg td{padding:0;border:1px solid var(--line);width:30px;height:30px}
.lg td.edge{border-right:2px solid var(--ink)}
.lg td.void{border:0}
.lc{width:30px;height:30px;border:0;background:transparent;padding:0;font-size:15px;line-height:1;display:grid;place-items:center}
.lc:hover{background:var(--peer)}
.lc.x{color:var(--muted)}

.lg-opts{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:12px}

#modal{position:fixed;inset:0;background:rgba(10,18,20,.55);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));z-index:50}
.sheet{background:var(--paper);color:var(--ink);border-radius:12px;max-width:420px;width:100%;padding:26px;display:grid;gap:14px;text-align:center;border:2px solid var(--ink)}
.sheet h2{font-size:34px}
.sheet .big-stars{font-size:34px;letter-spacing:4px;color:var(--pencil)}
.sheet .big-stars .off{color:var(--line)}
.sheet .facts{display:flex;justify-content:center;gap:22px;flex-wrap:wrap}
.sheet .facts div{display:grid}
.sheet .facts b{font:800 22px var(--f-display);font-variant-numeric:tabular-nums}
.sheet .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}

.fin-c.blk,.plp-c.blk,.lbx-c.blk{background:var(--ink)}

.plp-c.from{box-shadow:inset 0 0 0 2px var(--pencil)}

/* ================= Sudoku ================= */
function pc(m){let n=0;while(m){m&=m-1;n++;}return n;}

    for(const v of digits){if(!(bm&(1<<v)))continue;const m=1<<v;g[best]=v;R[r]|=m;C[c]|=m;B[b]|=m;const stop=rec();g[best]=0;R[r]^=m;C[c]^=m;B[b]^=m;if(stop)return true;}
    return false;
  }
  rec();return{count,first};
}
const Sudoku={
  name:'Sudoku',blurb:'Fill every row, column and box with 1 to 9.',
  gen(rng,diff){
    const sol=sudSolve(new Array(81).fill(0),1,rng).first;
    const g=sol.slice();
    const target={easy:40,medium:33,hard:28,expert:24}[diff];
    let givens=81;
    for(const i of shuffle(rng,[...Array(41).keys()])){
      if(givens<=target)break;
      const j=80-i,a=g[i],b=g[j];g[i]=0;g[j]=0;
      if(sudSolve(g,2).count!==1){g[i]=a;g[j]=b;}else givens-=(i===j?1:2);

  },
  mount(root,data,ctx){
    const{puzzle,sol}=data;
    let vals=puzzle.slice(),notes=new Array(81).fill(0),hinted=new Set(),wrong=new Set(),sel=puzzle.indexOf(0),noteMode=false;
    root.innerHTML=`<div class="sud-wrap"><div class="sud" aria-label="Sudoku grid"></div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}" aria-label="Enter ${n}">${n}<small></small></button>`).join('')}

      <p class="tip">On a keyboard: type 1–9, arrows to move, N for pencil notes, Backspace to erase.</p></div>`;
    const gridEl=root.querySelector('.sud'),cells=[];
    for(let i=0;i<81;i++){const b=document.createElement('button');const r=i/9|0,c=i%9;let base='sc';if(c%3===2&&c<8)base+=' br';if(r%3===2&&r<8)base+=' bb';if(c===8)base+=' endc';if(r===8)base+=' lr';if(puzzle[i])base+=' given';b.dataset.base=base;b.dataset.i=i;gridEl.appendChild(b);cells.push(b);}
    const box=i=>((i/27|0)*3)+((i%9)/3|0);

      hint(){const i=(sel>=0&&!puzzle[sel]&&vals[sel]!==sol[sel])?sel:vals.findIndex((v,j)=>v!==sol[j]);if(i<0)return false;vals[i]=sol[i];notes[i]=0;hinted.add(i);wrong.delete(i);sel=i;render();ctx.changed();if(won())ctx.solved();return true;},
      check(){wrong=new Set();vals.forEach((v,i)=>{if(v&&v!==sol[i])wrong.add(i);});render();return wrong.size?`${wrong.size} square${wrong.size>1?'s':''} marked in red need another look.`:'Everything you have filled in so far is correct.';},
      destroy(){document.removeEventListener('keydown',onKey);}

  }

/* ================= Word Chains ================= */
const oneApart=(a,b)=>{if(a.length!==4||b.length!==4)return false;let d=0;for(let i=0;i<4;i++)if(a[i]!==b[i])d++;return d===1;};
let GRAPH=null;
function wordGraph(){
  if(GRAPH)return GRAPH;const buckets=new Map();
  for(const w of WORDS4)for(let i=0;i<4;i++){const k=w.slice(0,i)+'_'+w.slice(i+1);if(!buckets.has(k))buckets.set(k,[]);buckets.get(k).push(w);}
  GRAPH=new Map(WORDS4.map(w=>[w,[]]));
  for(const g of buckets.values())for(const a of g)for(const b of g)if(a!==b)GRAPH.get(a).push(b);
  return GRAPH;

function makeLadder(rng,steps,avoid){
  const G=wordGraph();
  for(let t=0;t<300;t++){
    const s=pick(rng,COMMON4);if(avoid.has(s)||G.get(s).length<2)continue;
    const dist=new Map([[s,0]]),par=new Map(),q=[s];
    while(q.length){const w=q.shift();const d=dist.get(w);if(d>=steps)continue;for(const n of G.get(w))if(!dist.has(n)){dist.set(n,d+1);par.set(n,w);q.push(n);}}
    const ends=COMMON4.filter(w=>dist.get(w)===steps&&!avoid.has(w));
    if(!ends.length)continue;
    const e=pick(rng,ends),path=[e];while(path[0]!==s)path.unshift(par.get(path[0]));
    return{start:s,end:e,path};
  }
  return null;

      const used={};for(const c in guess)used[guess[c]]=(used[guess[c]]||0)+1;
      for(const el of inputs){const c=el.dataset.c,v=guess[c]||'';if(el.value!==v)el.value=v;el.readOnly=locked.has(c);
        el.className=(locked.has(c)?'locked':'')+(v&&used[v]>1?' dup':'')+(wrong.has(c)?' wrong':'')+(focusC===c?' same':'');}
      root.querySelector('.abc').innerHTML=ABC.split('').map(l=>`<span class="${used[l]?'used':''}">${l}</span>`).join('');
    }
    const won=()=>Object.keys(inv).every(c=>!plain.includes(inv[c])||guess[c]===inv[c]);
    root.addEventListener('focusin',e=>{if(e.target.dataset.c){focusC=e.target.dataset.c;render();}});
    root.addEventListener('input',e=>{const t=e.target;if(!t.dataset.c||locked.has(t.dataset.c))return;const v=t.value.toUpperCase().replace(/[^A-Z]/g,'');const ch=v.slice(-1);
      if(ch)guess[t.dataset.c]=ch;else delete guess[t.dataset.c];wrong.delete(t.dataset.c);render();ctx.changed();
      if(ch){const k=inputs.indexOf(t);const nx=inputs.slice(k+1).find(x=>!x.value)||inputs.find(x=>!x.value);if(nx)nx.focus();}
      if(won())ctx.solved();});
    root.addEventListener('keydown',e=>{const t=e.target;if(!t.dataset.c)return;const k=inputs.indexOf(t);
      if(e.key==='Backspace'&&!t.value&&k>0){e.preventDefault();inputs[k-1].focus();}
      else if(e.key==='ArrowLeft'&&k>0){e.preventDefault();inputs[k-1].focus();}
      else if(e.key==='ArrowRight'&&k<inputs.length-1){e.preventDefault();inputs[k+1].focus();}});
    render();
    return{
      snapshot:()=>({guess,locked:[...locked]}),restore(s){guess=Object.assign({},s.guess);(s.locked||[]).forEach(c=>locked.add(c));render();},
      hint(){const cs=[...new Set(inputs.map(i=>i.dataset.c))].filter(c=>!locked.has(c)&&guess[c]!==inv[c]);if(!cs.length)return false;
        const c=cs.find(x=>guess[x])&&cs.find(x=>guess[x]&&guess[x]!==inv[x])||cs[0];
        for(const o in guess)if(guess[o]===inv[c]&&o!==c&&!locked.has(o))delete guess[o];
        guess[c]=inv[c];locked.add(c);wrong.delete(c);render();ctx.changed();if(won())ctx.solved();return true;},
      check(){wrong=new Set(Object.keys(guess).filter(c=>guess[c]!==inv[c]));render();return wrong.size?`${wrong.size} letter${wrong.size>1?'s are':' is'} wrong (marked in red).`:'Every letter so far is right.';},
      destroy(){}
    };
  }
};

/* ================= Word Scramble ================= */
const Scramble={
  name:'Word Scramble',blurb:'Unscramble themed words, one row at a time.',
  gen(rng,diff){
    const[lo,hi,count]={easy:[4,5,5],medium:[5,6,6],hard:[6,7,6],expert:[8,11,6]}[diff];
    const scored=shuffle(rng,THEMES).map(t=>({t,ws:t.words.filter(w=>!w.includes(' ')&&w.length>=lo&&w.length<=hi)}));
    let best=scored.find(s=>s.ws.length>=count);
    if(!best){const t=scored[0].t;best={t,ws:t.words.filter(w=>!w.includes(' ')).sort((a,b)=>Math.abs(a.length-(lo+hi)/2)-Math.abs(b.length-(lo+hi)/2))};}
    const words=shuffle(rng,best.ws).slice(0,count).map(w=>{let s;do{s=shuffle(rng,w.split('')).join('');}while(s===w);return{w,s};});
    return{theme:best.t.name,words,firstLetter:diff==='easy'};
  },
  mount(root,data,ctx){
    let entries=data.words.map(()=>'');
    root.innerHTML=`<p class="eyebrow" style="margin-bottom:6px">Theme · ${esc(data.theme)}</p><p class="muted" style="margin-bottom:12px">Rearrange each set of tiles into a word that fits the theme.</p>
      <div class="scr">${data.words.map((x,i)=>`<div class="scr-row" data-i="${i}"><div class="tiles">${x.s.split('').map(c=>`<span>${c}</span>`).join('')}</div><input id="scr-${i}" data-i="${i}" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="${data.firstLetter?x.w[0]+'…':''}" aria-label="Answer ${i+1}"><span class="mk good"></span></div>`).join('')}</div>`;
    const inputs=[...root.querySelectorAll('input')];
    const won=()=>data.words.every((x,i)=>entries[i]===x.w);
    function render(){data.words.forEach((x,i)=>{const row=root.querySelector(`.scr-row[data-i="${i}"]`),ok=entries[i]===x.w;row.classList.toggle('ok',ok);row.querySelector('.mk').textContent=ok?'✓':'';if(inputs[i].value!==entries[i])inputs[i].value=entries[i];inputs[i].readOnly=ok;});}
    root.addEventListener('input',e=>{const t=e.target;if(!t.dataset.i)return;const i=+t.dataset.i;entries[i]=t.value.toUpperCase().replace(/[^A-Z]/g,'');render();ctx.changed();
      if(entries[i]===data.words[i].w){const nx=inputs.find((x,j)=>entries[j]!==data.words[j].w);if(nx)nx.focus();}
      if(won())ctx.solved();});
    render();
    return{
      snapshot:()=>({entries}),restore(s){entries=s.entries.slice();render();},
      hint(){const i=data.words.findIndex((x,j)=>entries[j]!==x.w);if(i<0)return false;const w=data.words[i].w;let k=0;while(k<w.length&&entries[i][k]===w[k])k++;entries[i]=w.slice(0,k+1);render();inputs[i].focus();ctx.changed();if(won())ctx.solved();return true;},
      check(){const left=data.words.filter((x,i)=>entries[i]!==x.w).length;return left?`${left} word${left>1?'s':''} still to unscramble.`:'All solved!';},
      destroy(){}
    };
  }
};

/* ================= Logic Grid ================= */
function perms(n){if(n===1)return[[0]];const out=[];for(const p of perms(n-1))for(let i=0;i<=p.length;i++){const q=p.slice();q.splice(i,0,n-1);out.push(q);}return out;}
const PERMS={3:perms(3),4:perms(4),5:perms(5)};
function personOf(A,c,i){const a=A[c];for(let p=0;p<a.length;p++)if(a[p]===i)return p;return -1;}
function evalClue(cl,A){
  switch(cl.t){
    case'pos':return personOf(A,cl.a[0],cl.a[1])===personOf(A,cl.b[0],cl.b[1]);
    case'neg':return personOf(A,cl.a[0],cl.a[1])!==personOf(A,cl.b[0],cl.b[1]);
    case'either':{const pa=personOf(A,cl.a[0],cl.a[1]);return pa===personOf(A,cl.b,cl.items[0])||pa===personOf(A,cl.b,cl.items[1]);}
    case'cmp':case'gap':{const pa=personOf(A,cl.a[0],cl.a[1]),pb=personOf(A,cl.b[0],cl.b[1]);if(pa===pb)return false;const va=A[cl.o][pa],vb=A[cl.o][pb];return cl.t==='gap'?vb-va===cl.k:(cl.less?va<vb:va>vb);}
  }
}
function logicCount(n,K,clues,limit){
  const P=PERMS[n],A=[[...Array(n).keys()]],by=[];for(let c=0;c<=K;c++)by.push([]);
  for(const cl of clues)by[cl.m].push(cl);
  let count=0;
  function rec(c){if(c>K){count++;return count>=limit;}
    outer:for(const p of P){A[c]=p;for(const cl of by[c])if(!evalClue(cl,A))continue outer;if(rec(c+1))return true;}return false;}
  rec(1);return count;
}
const Logic={
  name:'Logic Grid',blurb:'Use the clues to match every person to their details.',
  gen(rng,diff){
    const cfg={easy:{n:3,k:2,ord:false,w:{pos:2,neg:3}},medium:{n:4,k:2,ord:true,w:{pos:2,neg:3,either:1,cmp:2}},hard:{n:4,k:3,ord:true,w:{pos:1,neg:3,either:2,cmp:2,gap:1}},expert:{n:5,k:3,ord:true,w:{pos:1,neg:3,either:2,cmp:3,gap:2}}}[diff];
    const theme=pick(rng,LOGIC_THEMES),n=cfg.n,K=cfg.k;
    const unord=theme.cats.filter(c=>!c.ordered),ordCat=theme.cats.find(c=>c.ordered);
    let chosen=cfg.ord?shuffle(rng,unord).slice(0,K-1).concat([ordCat]):shuffle(rng,unord).slice(0,K);
    chosen=shuffle(rng,chosen);
    const cats=[{label:theme.label,items:shuffle(rng,NAMES).slice(0,n),people:true}].concat(chosen.map(c=>{let items;if(c.ordered){const st=c.fixedStart?0:rint(rng,c.items.length-n+1);items=c.items.slice(st,st+n);}else items=shuffle(rng,c.items).slice(0,n);return Object.assign({},c,{items});}));
    const o=cats.findIndex(c=>c.ordered);
    const sol=[[...Array(n).keys()]];for(let c=1;c<=K;c++)sol.push(shuffle(rng,[...Array(n).keys()]));
    const types=Object.keys(cfg.w),wsum=types.reduce((s,t)=>s+cfg.w[t],0);
    const nonOrd=[...Array(K+1).keys()].filter(c=>c!==o);
    function two(arr){const a=pick(rng,arr);let b;do{b=pick(rng,arr);}while(b===a);return[a,b];}
    function rp(){return rint(rng,n);}
    function pq(){const p=rp();let q;do{q=rp();}while(q===p);return[p,q];}
    function randClue(){
      let r=rng()*wsum,t=types[0];for(const x of types){r-=cfg.w[x];if(r<0){t=x;break;}}
      const all=[...Array(K+1).keys()];
      if(t==='pos'){const p=rp(),[a,b]=two(all);return{t,a:[a,sol[a][p]],b:[b,sol[b][p]],m:Math.max(a,b)};}
      if(t==='neg'){const[p,q]=pq(),[a,b]=two(all);return{t,a:[a,sol[a][p]],b:[b,sol[b][q]],m:Math.max(a,b)};}
      if(t==='either'){const[p,q]=pq(),[a,b]=two(all);return{t,a:[a,sol[a][p]],b,items:shuffle(rng,[sol[b][p],sol[b][q]]),m:Math.max(a,b)};}
      let[p,q]=pq();const ca=pick(rng,nonOrd),cb=pick(rng,nonOrd);
      if(t==='cmp'){return{t,a:[ca,sol[ca][p]],b:[cb,sol[cb][q]],o,less:sol[o][p]<sol[o][q],m:Math.max(ca,cb,o)};}
      if(sol[o][p]>sol[o][q])[p,q]=[q,p];
      return{t:'gap',a:[ca,sol[ca][p]],b:[cb,sol[cb][q]],o,k:sol[o][q]-sol[o][p],m:Math.max(ca,cb,o)};
    }
    let clues=[];const seen=new Set();
    for(let tries=0;tries<500&&logicCount(n,K,clues,2)>1;tries++){const c=randClue();const key=JSON.stringify(c);if(seen.has(key))continue;seen.add(key);clues.push(c);}
    const order=diff==='expert'?clues.filter(c=>c.t==='pos').concat(shuffle(rng,clues.filter(c=>c.t!=='pos'))):shuffle(rng,clues);
    for(const c of order){const rest=clues.filter(x=>x!==c);if(logicCount(n,K,rest,2)===1)clues=rest;}
    clues=shuffle(rng,clues);
    const noun=theme.noun;
    const subj=([c,i])=>c===0?cats[0].items[i]:`the ${noun} who ${cats[c].verb} ${cats[c].items[i]}`;
    const text=cl=>{
      if(cl.t==='pos'||cl.t==='neg'){let a=cl.a,b=cl.b;if(b[0]===0)[a,b]=[b,a];const cb=cats[b[0]];return cap(`${subj(a)} ${cl.t==='pos'?cb.verb:cb.neg} ${cb.items[b[1]]}.`);}
      if(cl.t==='either'){const cb=cats[cl.b],x=cb.items[cl.items[0]],y=cb.items[cl.items[1]];return cap(cl.b===0?`${subj(cl.a)} is either ${x} or ${y}.`:`${subj(cl.a)} ${cb.verb} either ${x} or ${y}.`);}
      const oc=cats[cl.o];
      if(cl.t==='cmp')return cap(`${subj(cl.a)} ${cl.less?oc.less:oc.more} ${subj(cl.b)}.`);
      return cap(`${subj(cl.a)} ${oc.gap(cl.k)} ${subj(cl.b)}.`);
    };
    const intros=chosen.map(c=>c.intro);
    const intro=`${theme.lead} Each ${noun} ${intros.length>1?intros.slice(0,-1).join(', ')+(intros.length>2?',':'')+' and '+intros[intros.length-1]:intros[0]}.`;
    return{title:theme.title,intro,n,K,cats:cats.map(c=>({label:c.label,items:c.items})),sol,clues:clues.map(text)};
  },
  mount(root,data,ctx){
    const{n,K,cats,sol}=data;
    const colCats=[...Array(K).keys()].map(x=>x+1),rowCats=[0].concat([...Array(K-1).keys()].map(x=>K-x));
    const lab=s=>cap(s.replace(/^(a|an|the) /,''));
    const truth=(r,i,c,j)=>(r===0?i:sol[r].indexOf(i))===sol[c].indexOf(j)&&true;
    const pOf=(c,i)=>c===0?i:sol[c].indexOf(i);
    let marks={},struck=new Set(),wrong=new Set();
    let html=`<p class="eyebrow">${esc(data.title)}</p><p class="lg-intro" style="margin-top:6px">${esc(data.intro)}</p><div class="lg-scroll"><table class="lg"><thead><tr><th colspan="2"></th>${colCats.map(c=>`<th class="cat-h" colspan="${n}">${esc(cats[c].label)}</th>`).join('')}</tr><tr><th colspan="2"></th>${colCats.map(c=>cats[c].items.map((it,j)=>`<th class="item-h${j===n-1?' edge':''}"><span>${esc(lab(it))}</span></th>`).join('')).join('')}</tr></thead><tbody>`;
    for(const r of rowCats)for(let i=0;i<n;i++){
      html+=`<tr class="${i===0?'gstart':''}">${i===0?`<th class="cat-v" rowspan="${n}">${esc(cats[r].label)}</th>`:''}<th class="item-v">${esc(lab(cats[r].items[i]))}</th>`;
      for(const c of colCats)for(let j=0;j<n;j++){
        if(r===0||c<r)html+=`<td class="${j===n-1?'edge':''}"><button class="lc" data-k="${r}.${i}.${c}.${j}" aria-label="${esc(lab(cats[r].items[i]))} and ${esc(lab(cats[c].items[j]))}"></button></td>`;
        else html+=`<td class="void"></td>`;
      }
      html+='</tr>';
    }
    html+=`</tbody></table></div><div class="lg-opts"><label class="switch"><input type="checkbox" id="autox" ${ctx.settings.autoCross?'checked':''}> Fill in the ✕ marks for me</label><span class="tip">Tap a square once for ✕ (no), twice for ● (yes). Tap a clue to cross it off.</span></div>
      <ol class="clues">${data.clues.map((c,i)=>`<li data-ci="${i}">${esc(c)}</li>`).join('')}</ol>`;
    root.innerHTML=html;
    const btns=[...root.querySelectorAll('.lc')];
    function render(){
      for(const b of btns){const v=marks[b.dataset.k]||0;b.textContent=v===1?'✕':v===2?'●':'';b.className='lc'+(v===1?' x':v===2?' o':'')+(wrong.has(b.dataset.k)?' wrong':'');}
      root.querySelectorAll('.clues li').forEach(li=>li.classList.toggle('struck',struck.has(+li.dataset.ci)));
    }
    function place(r,i,c,j){const k=`${r}.${i}.${c}.${j}`;marks[k]=2;
      if(ctx.settings.autoCross)for(let x=0;x<n;x++){if(x!==j&&!marks[`${r}.${i}.${c}.${x}`])marks[`${r}.${i}.${c}.${x}`]=1;if(x!==i&&!marks[`${r}.${x}.${c}.${j}`])marks[`${r}.${x}.${c}.${j}`]=1;}}
    function won(){for(let p=0;p<n;p++)for(const c of colCats){for(let j=0;j<n;j++){const want=sol[c][p]===j;if((marks[`0.${p}.${c}.${j}`]===2)!==want)return false;}}return true;}
    root.querySelector('.lg').addEventListener('click',e=>{const b=e.target.closest('.lc');if(!b)return;const k=b.dataset.k,[r,i,c,j]=k.split('.').map(Number);const v=((marks[k]||0)+1)%3;
      if(v===2)place(r,i,c,j);else if(v===0)delete marks[k];else marks[k]=v;wrong.delete(k);render();ctx.changed();if(won())ctx.solved();});
    root.querySelector('.clues').addEventListener('click',e=>{const li=e.target.closest('li');if(!li)return;const i=+li.dataset.ci;struck.has(i)?struck.delete(i):struck.add(i);render();ctx.changed();});
    root.querySelector('#autox').addEventListener('change',e=>{ctx.setSetting('autoCross',e.target.checked);});
    render();
    return{
      snapshot:()=>({marks,struck:[...struck]}),restore(s){marks=Object.assign({},s.marks);struck=new Set(s.struck||[]);render();},
      hint(){for(let p=0;p<n;p++)for(const c of colCats){const j=sol[c][p],k=`0.${p}.${c}.${j}`;if(marks[k]!==2){for(let x=0;x<n;x++){if(x!==j)marks[`0.${p}.${c}.${x}`]=1;if(x!==p)marks[`0.${x}.${c}.${j}`]=1;}marks[k]=2;wrong.delete(k);render();ctx.changed();if(won())ctx.solved();return true;}}return false;},
      check(){wrong=new Set();for(const k in marks){const[r,i,c,j]=k.split('.').map(Number);const t=pOf(r,i)===pOf(c,j);if((marks[k]===2&&!t)||(marks[k]===1&&t))wrong.add(k);}render();return wrong.size?`${wrong.size} mark${wrong.size>1?'s':''} in red ${wrong.size>1?'are':'is'} wrong.`:'Every mark so far is correct.';},
      destroy(){}
    };
  }
};

/* ================= Fill-In ================= */
function xwBuild(rng,N,target,lo,hi){
  const A=new Array(N*N).fill(''),O=new Array(N*N).fill(0),words=[],used=new Set();
  const pool=[];for(let L=lo;L<=hi;L++)for(const w of(BYLEN[L]||[]))pool.push(w);
  const P=shuffle(rng,pool);
  const can=(w,r,c,d)=>{
    const dr=d,dc=1-d,L=w.length,r1=r+dr*(L-1),c1=c+dc*(L-1);
    if(r<0||c<0||r1>=N||c1>=N)return -1;
    const br=r-dr,bc=c-dc,ar=r+dr*L,ac=c+dc*L;
    if(br>=0&&bc>=0&&A[br*N+bc])return -1;
    if(ar<N&&ac<N&&A[ar*N+ac])return -1;
    let x=0;
    for(let i=0;i<L;i++){
      const rr=r+dr*i,cc=c+dc*i,id=rr*N+cc;
      if(A[id]){if(A[id]!==w[i]||(O[id]&(1<<d)))return -1;x++;}
      else{
        const p1r=rr+dc,p1c=cc+dr,p2r=rr-dc,p2c=cc-dr;
        if(p1r<N&&p1c<N&&A[p1r*N+p1c])return -1;
        if(p2r>=0&&p2c>=0&&A[p2r*N+p2c])return -1;
      }
    }
    return x;
  };
  const put=(w,r,c,d)=>{for(let i=0;i<w.length;i++){const id=(r+d*i)*N+c+(1-d)*i;A[id]=w[i];O[id]|=1<<d;}words.push({w,r,c,d});used.add(w);};
  const first=P.find(w=>w.length>=Math.min(hi,6));if(!first)return null;
  put(first,N>>1,(N-first.length)>>1,0);
  for(let pass=0;pass<3&&words.length<target;pass++){
    const need=pass===0?2:1;
    for(const w of P){
      if(words.length>=target)break;
      if(used.has(w))continue;
      let best=null,bx=0;
      for(let i=0;i<w.length;i++)for(let id=0;id<N*N;id++){
        if(A[id]!==w[i])continue;const rr=id/N|0,cc=id%N;
        for(let d=0;d<2;d++){
          if(O[id]&(1<<d))continue;
          const x=can(w,rr-d*i,cc-(1-d)*i,d);
          if(x>=need&&(x>bx||(x===bx&&rng()<.4))){bx=x;best=[rr-d*i,cc-(1-d)*i,d];}
        }
      }
      if(best)put(w,best[0],best[1],best[2]);
    }
  }
  // every run of 2+ letters must be one of the placed words
  const key=new Set(words.map(x=>`${x.d}|${x.r}|${x.c}|${x.w}`));
  for(let d=0;d<2;d++)for(let a=0;a<N;a++){let s='',st=0;
    for(let b=0;b<=N;b++){const ch=b<N?(d===0?A[a*N+b]:A[b*N+a]):'';
      if(ch){if(!s)st=b;s+=ch;}else{if(s.length>=2&&!key.has(`${d}|${d===0?a:st}|${d===0?st:a}|${s}`))return null;s='';}}}
  return{N,A,words};
}
const FillIn={
  name:'Fill-In',blurb:'Slot every word into its place in the crossing grid.',
  gen(rng,diff){
    const cfg={easy:{N:9,n:10,lo:3,hi:6,pre:2},medium:{N:11,n:15,lo:3,hi:7,pre:1},hard:{N:13,n:21,lo:3,hi:8,pre:0},expert:{N:15,n:28,lo:3,hi:8,pre:0}}[diff];
    let best=null;
    for(let a=0;a<40;a++){const r=xwBuild(rng,cfg.N,cfg.n,cfg.lo,cfg.hi);if(r&&(!best||r.words.length>best.words.length))best=r;if(best&&best.words.length>=cfg.n)break;}
    const{N,A,words}=best;
    let r0=N,r1=-1,c0=N,c1=-1;
    for(let i=0;i<N*N;i++)if(A[i]){const r=i/N|0,c=i%N;r0=Math.min(r0,r);r1=Math.max(r1,r);c0=Math.min(c0,c);c1=Math.max(c1,c);}
    const H=r1-r0+1,W=c1-c0+1,sol=new Array(H*W).fill('');
    for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)sol[(r-r0)*W+c-c0]=A[r*N+c];
    const slots=words.map(x=>{const r=x.r-r0,c=x.c-c0,cells=[];for(let i=0;i<x.w.length;i++)cells.push((r+x.d*i)*W+c+(1-x.d)*i);return{w:x.w,d:x.d,r,c,cells};})
      .sort((a,b)=>a.r-b.r||a.c-b.c||a.d-b.d).map((s,i)=>Object.assign(s,{i}));
    const longest=slots.slice().sort((a,b)=>b.w.length-a.w.length).slice(0,Math.max(3,cfg.pre*2));
    const given=shuffle(rng,longest).slice(0,cfg.pre).map(s=>s.i);
    return{W,H,sol,slots,given};
  },
  mount(root,data,ctx){
    const{W,H,sol,slots,given}=data;
    let placed=new Array(slots.length).fill(null),locked=new Set(given),sel=null;
    given.forEach(i=>placed[i]=slots[i].w);
    const byLen={};slots.forEach(s=>(byLen[s.w.length]=byLen[s.w.length]||[]).push(s.w));
    for(const k in byLen)byLen[k].sort();
    const cover=new Array(W*H).fill(0).map(()=>[]);slots.forEach(s=>s.cells.forEach(c=>cover[c].push(s.i)));
    root.innerHTML=`<p class="muted" style="margin-bottom:14px;max-width:62ch">Tap a word below, then tap the spot in the grid where it belongs. Dotted squares mark where a word could start. Tap a placed word to pick it back up.</p>
      <div class="fin-grid" style="--w:${W}" aria-label="Fill-in grid"></div><div class="fin-lists"></div>`;
    const grid=root.querySelector('.fin-grid'),lists=root.querySelector('.fin-lists');
    const cells=[];for(let i=0;i<W*H;i++){const b=document.createElement(sol[i]?'button':'div');b.dataset.i=i;if(!sol[i])b.className='fin-c blk';else b.setAttribute('aria-label',`Row ${(i/W|0)+1}, column ${i%W+1}`);grid.appendChild(b);cells.push(b);}
    function letters(skip){const L=new Array(W*H).fill('');slots.forEach(s=>{if(s.i===skip||!placed[s.i])return;for(let k=0;k<s.cells.length;k++)L[s.cells[k]]=placed[s.i][k];});return L;}
    function fits(s,w,L){if(s.w.length!==w.length)return false;for(let k=0;k<s.cells.length;k++){const x=L[s.cells[k]];if(x&&x!==w[k])return false;}return true;}
    const isPlaced=w=>placed.some(p=>p===w);
    function render(){
      const L=letters(-1);
      const cand=new Set(),starts=new Set();
      if(sel)for(const s of slots){if(locked.has(s.i))continue;if(fits(s,sel,letters(s.i))){s.cells.forEach(c=>cand.add(c));starts.add(s.cells[0]);}}
      cells.forEach((b,i)=>{if(!sol[i])return;let cls='fin-c';if(L[i])cls+=' has';if(cand.has(i))cls+=' cand';if(starts.has(i))cls+=' start';
        if(cover[i].some(j=>locked.has(j)&&placed[j]))cls+=' lock';if(cover[i].some(j=>wrong.has(j)))cls+=' wrong';b.className=cls;b.textContent=L[i];});
      lists.innerHTML=Object.keys(byLen).map(Number).sort((a,b)=>a-b).map(n=>`<div class="fin-len"><b>${n} letters</b>${byLen[n].map(w=>{const pl=isPlaced(w),lk=slots.some(s=>s.w===w&&locked.has(s.i));return`<button class="wchip${pl?' on':''}${sel===w?' sel':''}" data-w="${w}"${lk?' disabled':''}>${w}</button>`;}).join('')}</div>`).join('');
    }
    let wrong=new Set();
    const won=()=>slots.every(s=>placed[s.i]);
    function put(s,w){placed[s.i]=w;sel=null;wrong=new Set();render();ctx.changed();if(won())ctx.solved();}
    grid.addEventListener('click',e=>{const b=e.target.closest('button.fin-c');if(!b)return;const i=+b.dataset.i,cs=cover[i].map(j=>slots[j]);
      if(sel){const ok=cs.filter(s=>!locked.has(s.i)&&fits(s,sel,letters(s.i)));
        if(!ok.length){ctx.toast('That word does not fit there.');return;}
        put(ok.find(s=>s.cells[0]===i)||ok.find(s=>!placed[s.i])||ok[0],sel);}
      else{const ps=cs.filter(s=>placed[s.i]&&!locked.has(s.i));if(ps.length){sel=placed[ps[0].i];placed[ps[0].i]=null;wrong=new Set();render();ctx.changed();}}});
    lists.addEventListener('click',e=>{const b=e.target.closest('.wchip');if(!b||b.disabled)return;const w=b.dataset.w;
      if(isPlaced(w)){const s=slots.find(x=>placed[x.i]===w);placed[s.i]=null;sel=w;wrong=new Set();ctx.changed();}
      else sel=sel===w?null:w;render();});
    render();
    return{
      snapshot:()=>({placed,locked:[...locked]}),
      restore(s){placed=s.placed.slice();locked=new Set(s.locked||[]);sel=null;render();},
      hint(){
        const todo=slots.filter(s=>placed[s.i]!==s.w).sort((a,b)=>b.w.length-a.w.length);if(!todo.length)return false;
        const s=todo[0];const other=slots.find(x=>x.i!==s.i&&placed[x.i]===s.w);if(other)placed[other.i]=null;
        for(const u of slots){if(u.i===s.i||!placed[u.i]||locked.has(u.i))continue;
          for(let k=0;k<s.cells.length;k++){const q=u.cells.indexOf(s.cells[k]);if(q>=0&&placed[u.i][q]!==s.w[k]){placed[u.i]=null;break;}}}
        placed[s.i]=s.w;locked.add(s.i);if(sel===s.w)sel=null;wrong=new Set();render();ctx.changed();if(won())ctx.solved();return true;},
      check(){wrong=new Set(slots.filter(s=>placed[s.i]&&placed[s.i]!==s.w).map(s=>s.i));render();
        const n=placed.filter(Boolean).length;
        return wrong.size?`${wrong.size} placed word${wrong.size>1?'s are':' is'} not where the answer key has ${wrong.size>1?'them':'it'} (marked in red).`:`${n} of ${slots.length} words placed, and all of them are right.`;},
      destroy(){}
    };
  }
};

/* ================= Letterboxes ================= */
function lbBuild(rng,words,N,dirs,tries){
  let best=null;
  for(let t=0;t<tries;t++){
    const g=new Array(N*N).fill(''),st=new Set(),pl=[];
    const order=shuffle(rng,words).sort((a,b)=>b.length-a.length+(rng()<.3?1:0));
    for(const W of order){
      let pick=null,ps=-1;
      for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(let di=0;di<dirs.length;di++){
        const[dr,dc]=dirs[di],r1=r+dr*(W.length-1),c1=c+dc*(W.length-1);
        if(!inB(r1,c1,N,N)||st.has(r*N+c))continue;
        let ov=0,nw=0,ok=true;
        for(let k=0;k<W.length;k++){const ch=g[(r+dr*k)*N+c+dc*k];if(ch){if(ch!==W[k]){ok=false;break;}ov++;}else nw++;}
        if(!ok||nw===0)continue;
        const sc=(pl.length?(ov>0?4:0):0)+Math.min(ov,3)+rng()*3;
        if(sc>ps){ps=sc;pick={r,c,dr,dc,di};}
      }
      if(!pick)continue;
      for(let k=0;k<W.length;k++)g[(pick.r+pick.dr*k)*N+pick.c+pick.dc*k]=W[k];
      st.add(pick.r*N+pick.c);pl.push({W,r:pick.r,c:pick.c,dr:pick.dr,dc:pick.dc});
    }
    const cov=g.filter(Boolean).length;
    if(!best||cov>best.cov||(cov===best.cov&&pl.length>best.pl.length))best={g,pl,cov};
  }
  return best;
}
const Letterboxes={
  name:'Letterboxes',blurb:'Circled letters start the words. Fill in the rest.',
  gen(rng,diff){
    const cfg={easy:{N:7,dirs:2,pre:2,tries:80},medium:{N:9,dirs:4,pre:1,tries:60},hard:{N:10,dirs:6,pre:1,tries:50},expert:{N:11,dirs:8,pre:1,tries:40}}[diff];
    const N=cfg.N,dirs=DIR8.slice(0,cfg.dirs);

    const th=themes[rint(rng,Math.min(3,themes.length))];

    const words=b.pl.map(p=>p.W).sort();

    shuffle(rng,b.pl.filter(p=>p.W.length>=5)).slice(0,cfg.pre).forEach(p=>{for(let k=0;k<p.W.length;k++)given.add((p.r+p.dr*k)*N+p.c+p.dc*k);});

  mount(root,data,ctx){

      restore(s){L=s.L.slice();hinted=new Set(s.hinted||[]);render();},
      hint(){const idx=sol.map((ch,i)=>i).filter(i=>sol[i]&&L[i]!==sol[i]);if(!idx.length)return false;

  }

/* ================= Places, Please ================= */
function ppBuild(rng,N,groups,per,dirs,tries){
  const pool=[];for(let L=3;L<=Math.min(N,8);L++)for(const w of(BYLEN[L]||[]))pool.push(w);
  const byFirst={};pool.forEach(w=>(byFirst[w[0]]=byFirst[w[0]]||[]).push(w));
  let best=null;
  for(let t=0;t<tries;t++){
    const g=new Array(N*N).fill(''),used=new Set(),starts=new Set(),out=[];
    for(let gi=0;gi<groups;gi++){
      let done=false;
      for(let tr=0;tr<30&&!done;tr++){
        const sid=rint(rng,N*N);if(starts.has(sid))continue;
        const r=sid/N|0,c=sid%N;
        const letter=g[sid]||pick(rng,pool)[0];
        const cands=shuffle(rng,byFirst[letter]||[]).filter(w=>!used.has(w)).slice(0,40);
        const want=per[0]+rint(rng,per[1]-per[0]+1);
        const takenDirs=new Set(),chosen=[],touched=[];
        for(const w of cands){
          if(chosen.length>=want)break;
          let bd=-1,bn=-1;
          for(let di=0;di<dirs.length;di++){
            if(takenDirs.has(di))continue;const[dr,dc]=dirs[di];
            const r1=r+dr*(w.length-1),c1=c+dc*(w.length-1);if(!inB(r1,c1,N,N))continue;
            let ok=true,nw=0;for(let k=0;k<w.length;k++){const ch=g[(r+dr*k)*N+c+dc*k];if(ch&&ch!==w[k]){ok=false;break;}if(!ch)nw++;}
            if(!ok)continue;const sc=nw+rng()*2;if(sc>bn){bn=sc;bd=di;}
          }
          if(bd<0)continue;
          const[dr,dc]=dirs[bd];
          for(let k=0;k<w.length;k++){const id=(r+dr*k)*N+c+dc*k;if(!g[id]){g[id]=w[k];touched.push(id);}}

const PlacesPlease={
  name:'Places, Please',blurb:'Send each numbered group of words off in its own direction.',
  gen(rng,diff){

    const grps=b.out.sort((a,c)=>a.r-c.r||a.c-c.c).map((x,i)=>({num:i+1,r:x.r,c:x.c,words:x.words.map(y=>({w:y.w,di:y.di})).sort((p,q)=>p.w.localeCompare(q.w))}));
    return{N,sol:b.g,groups:grps};
  },
  mount(root,data,ctx){
    const{N,sol,groups}=data,D=DIR8;
    // placed[g][j] = direction index, or -1 when not placed yet
    let placed=groups.map(g=>g.words.map(()=>-1)),locked=new Set(),sel=null,wrong=new Set();
    const startAt=new Map(groups.map((g,gi)=>[g.r*N+g.c,gi]));
    root.innerHTML=`<p class="muted" style="margin-bottom:14px;max-width:62ch">Every word in a numbered group starts on that number and reads in a straight line in a different direction, forwards or backwards, up, down or diagonally. Tap a word, then tap the square where it ends. Black squares are never used. When you finish, every white square holds a letter.</p>
      <div class="plp-grid" style="--n:${N}" aria-label="Places, Please grid"></div><div class="plp-groups"></div>`;
    const grid=root.querySelector('.plp-grid'),gl=root.querySelector('.plp-groups');
    const cells=[];for(let i=0;i<N*N;i++){const b=document.createElement(sol[i]?'button':'div');b.dataset.i=i;if(!sol[i])b.className='plp-c blk';else b.setAttribute('aria-label',`Row ${(i/N|0)+1}, column ${i%N+1}`);grid.appendChild(b);cells.push(b);}
    const cellsOf=(g,j,di)=>{const gr=groups[g],w=gr.words[j].w,[dr,dc]=D[di];return w.split('').map((_,k)=>(gr.r+dr*k)*N+gr.c+dc*k);};
    function letters(skipG,skipJ){const Lt=new Array(N*N).fill('');groups.forEach((gr,g)=>gr.words.forEach((x,j)=>{if(placed[g][j]<0||(g===skipG&&j===skipJ))return;cellsOf(g,j,placed[g][j]).forEach((id,k)=>Lt[id]=x.w[k]);}));return Lt;}
    function options(g,j){ // end squares where the selected word could finish
      const gr=groups[g],w=gr.words[j].w,Lt=letters(g,j),out=[];
      const usedDirs=new Set(gr.words.map((_,q)=>q!==j?placed[g][q]:-1));
      for(let di=0;di<8;di++){if(usedDirs.has(di))continue;const[dr,dc]=D[di],r1=gr.r+dr*(w.length-1),c1=gr.c+dc*(w.length-1);if(!inB(r1,c1,N,N))continue;
        let ok=true;for(let k=0;k<w.length;k++){const id=(gr.r+dr*k)*N+gr.c+dc*k;if(!sol[id]||(Lt[id]&&Lt[id]!==w[k])){ok=false;break;}}
        if(ok)out.push({di,end:r1*N+c1});}
      return out;}
    const won=()=>placed.every(a=>a.every(d=>d>=0))&&letters(-1,-1).every((ch,i)=>!sol[i]||ch);
    function render(){
      const Lt=letters(-1),opts=sel?options(sel.g,sel.j):[],ends=new Map(opts.map(o=>[o.end,o.di]));
      cells.forEach((b,i)=>{if(!sol[i])return;let cls='plp-c';if(ends.has(i))cls+=' cand';if(sel&&startAt.get(i)===sel.g)cls+=' from';if(wrong.has(i))cls+=' wrong';b.className=cls;
        const gi=startAt.get(i);b.innerHTML=(gi!==undefined?`<sup>${groups[gi].num}</sup>`:'')+(Lt[i]||(gi!==undefined?`<span class="pre">${groups[gi].words[0].w[0]}</span>`:''));});
      gl.innerHTML=groups.map((gr,g)=>`<div class="plp-g"><span class="plp-n">${gr.num}</span><div class="plp-w">${gr.words.map((x,j)=>`<button class="wchip${placed[g][j]>=0?' on':''}${sel&&sel.g===g&&sel.j===j?' sel':''}" data-g="${g}" data-j="${j}"${locked.has(g+'.'+j)?' disabled':''}>${x.w}</button>`).join('')}</div></div>`).join('');
    }
    function place(g,j,di){placed[g][j]=di;sel=null;wrong=new Set();render();ctx.changed();if(won())ctx.solved();}
    grid.addEventListener('click',e=>{const b=e.target.closest('button.plp-c');if(!b)return;const i=+b.dataset.i;
      if(sel){const o=options(sel.g,sel.j).find(x=>x.end===i);if(o){place(sel.g,sel.j,o.di);return;}
        ctx.toast(options(sel.g,sel.j).length?'That word cannot end there. Try one of the dotted squares.':'No direction works for that word right now. Pick up a neighbouring word first.');return;}
      for(let g=0;g<groups.length;g++)for(let j=0;j<groups[g].words.length;j++){const di=placed[g][j];if(di>=0&&!locked.has(g+'.'+j)){const cs=cellsOf(g,j,di);if(cs[cs.length-1]===i){placed[g][j]=-1;sel={g,j};wrong=new Set();render();ctx.changed();return;}}}});
    gl.addEventListener('click',e=>{const b=e.target.closest('.wchip');if(!b||b.disabled)return;const g=+b.dataset.g,j=+b.dataset.j;
      if(placed[g][j]>=0){placed[g][j]=-1;sel={g,j};wrong=new Set();ctx.changed();}
      else sel=(sel&&sel.g===g&&sel.j===j)?null:{g,j};render();});
    render();
    return{
      snapshot:()=>({placed,locked:[...locked]}),
      restore(s){placed=s.placed.map(a=>a.slice());locked=new Set(s.locked||[]);sel=null;render();},
      hint(){
        let tg=-1,tj=-1;
        outer:for(let g=0;g<groups.length;g++)for(let j=0;j<groups[g].words.length;j++)if(placed[g][j]!==groups[g].words[j].di){tg=g;tj=j;break outer;}
        if(tg<0)return false;
        const di=groups[tg].words[tj].di,mine=new Set(cellsOf(tg,tj,di));
        const w=groups[tg].words[tj].w;
        placed[tg][tj]=-1;
        groups.forEach((gr,g)=>gr.words.forEach((x,j)=>{if((g===tg&&j===tj)||placed[g][j]<0||locked.has(g+'.'+j))return;
          const cs=cellsOf(g,j,placed[g][j]);let bad=false;cs.forEach((id,k)=>{if(mine.has(id)){const q=cellsOf(tg,tj,di).indexOf(id);if(w[q]!==x.w[k])bad=true;}});if(bad)placed[g][j]=-1;}));
        placed[tg][tj]=di;locked.add(tg+'.'+tj);sel=null;wrong=new Set();render();ctx.changed();if(won())ctx.solved();return true;},
      check(){wrong=new Set();let n=0;groups.forEach((gr,g)=>gr.words.forEach((x,j)=>{if(placed[g][j]>=0&&placed[g][j]!==x.di){n++;cellsOf(g,j,placed[g][j]).forEach(id=>wrong.add(id));}}));render();

      destroy(){}
    };
  }
};

function dailySpec(date){const d=new Date(date+'T12:00:00');const dayNum=Math.floor(d.getTime()/86400000);

function mergeProgress(a,b){

  m.xp=Math.max(a.xp||0,b.xp||0);m.earned=Math.max(a.earned||0,b.earned||0);m.spent=Math.max(a.spent||0,b.spent||0);m.bestStreak=Math.max(a.bestStreak||0,b.bestStreak||0);

    <section><p class="eyebrow" style="margin-bottom:10px">Pick a kind of puzzle</p><div class="quick">${TYPE_ORDER.map(t=>`<button class="qcard" data-act="free-type" data-t="${t}" aria-pressed="${state.freeType===t}">${ic(t)}<b>${TYPES[t].name}</b><small>${TYPES[t].blurb}</small></button>`).join('')}</div></section>
    <section><p class="eyebrow" style="margin-bottom:10px">Difficulty</p><div class="seg" role="group" aria-label="Difficulty">${DIFFS.map(d=>`<button data-act="free-diff" data-d="${d}" aria-pressed="${state.freeDiff===d}">${DLABEL[d]}</button>`).join('')}</div></section>
    <div><button class="btn" data-act="free-start">New ${TYPES[state.freeType].name.toLowerCase()} puzzle</button><p class="tip" style="margin-top:8px">Every puzzle is freshly made, so there is always another one.</p></div>
  </div>`;
}

function viewProgress(){
  const L=levelOf(P.xp),pct=Math.round(100*(P.xp-xpFor(L))/(xpFor(L+1)-xpFor(L)));
  const total=Object.values(P.solved).reduce((a,b)=>a+b,0),maxS=Math.max(1,...TYPE_ORDER.map(t=>P.solved[t]||0));
  const starsTotal=Object.values(P.levels).reduce((a,b)=>a+b,0),days=Object.keys(P.daily).length;
  const nextRank=RANKS.find(r=>r[0]>L);
  return`<div class="stack">
    <section class="panel"><p class="eyebrow">Solver level</p><h3 style="font-size:28px;margin-top:4px">Level ${L} · ${rankName(L)}</h3>
      <div class="xpbar"><i style="width:${pct}%"></i></div><p class="muted">${P.xp} XP · ${xpFor(L+1)-P.xp} more to level ${L+1}${nextRank?` · “${nextRank[1]}” at level ${nextRank[0]}`:''}</p>
      <p class="tip" style="margin-top:8px">XP for each new puzzle: Easy 10, Medium 20, Hard 35, Expert 50. Solving without hints earns half again, and the daily puzzle adds 10. Replayed levels and days earn no XP.</p></section>
    <section class="panel"><p class="eyebrow">Points for hints</p><div style="display:flex;align-items:baseline;gap:10px;margin-top:6px"><span class="streak-n">${balance()}</span><span class="muted">points to spend</span></div>
      <p style="margin-top:8px">Every finished puzzle earns points: Easy 5, Medium 10, Hard 15, Expert 20. Solving without hints earns half again, and the daily puzzle adds 5. Each hint costs ${HINT_COST} points.</p>
      <p class="tip" style="margin-top:6px">${P.earned||0} earned so far · ${P.spent||0} spent on hints · ${START_PTS} to start</p></section>
    <div class="stat-grid">
      <div class="stat"><b>${total}</b><span class="muted">puzzles solved</span></div>
      <div class="stat"><b>${maxLevel()}</b><span class="muted">journey levels</span></div>
      <div class="stat"><b>${starsTotal}</b><span class="muted">stars earned</span></div>
      <div class="stat"><b>${days}</b><span class="muted">daily puzzles</span></div>
      <div class="stat"><b>${Math.max(P.bestStreak,streakNow())}</b><span class="muted">best streak</span></div>
    </div>
    <section class="panel"><p class="eyebrow" style="margin-bottom:12px">Solved by type</p><div class="bars">${TYPE_ORDER.map(t=>`<div class="barrow"><span>${TYPES[t].name}</span><span class="track"><i style="width:${(P.solved[t]||0)/maxS*100}%"></i></span><span>${P.solved[t]||0}</span></div>`).join('')}</div></section>
    <section class="panel"><p class="eyebrow">Saving</p><p style="margin-top:6px">${cloud.ref?'Progress is saved to your Claude account and to this browser.':'Progress is saved in this browser on this device.'}</p>
      <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn ghost small" data-act="reset" id="resetbtn">Reset all progress</button></div></section>
  </div>`;
}

function viewPlay(){
  const s=state.play,T=TYPES[s.type];
  const where=s.kind==='daily'?`Puzzle of the day · ${new Date(s.date+'T12:00:00').toLocaleDateString(undefined,{month:'long',day:'numeric'})}`:s.kind==='level'?`Level ${s.level} · ${chapterName(Math.ceil(s.level/8))}`:'Free play';
  return`<div class="play-head"><button class="back" data-act="back" aria-label="Back">← Back</button><div style="min-width:0"><p class="eyebrow">${esc(where)}</p><h2>${T.name} <span class="pill d-${s.diff}">${DLABEL[s.diff]}</span></h2></div><span class="timer" id="timer">${fmtTime(s.elapsed)}</span></div>
    <div class="tools"><button class="btn ghost small" data-act="hint">Hint · ${HINT_COST} pts</button><button class="btn ghost small" data-act="check">Check my work</button><button class="btn ghost small" data-act="restart" id="restartbtn">Start over</button><span class="spacer"></span><span class="hints" id="hintcount">${s.hints?`${s.hints} hint${s.hints>1?'s':''} used`:''}</span></div>
    <div id="proot"><p class="loading">Setting up your puzzle…</p></div>`;
}

/* ---------- Playing a puzzle ---------- */
function saveCurrent(){const s=state.play;if(!s||s.done||!state.inst)return;lsSet(LSC,{key:s.key,spec:{type:s.type,diff:s.diff,seed:s.seed,key:s.key,kind:s.kind,date:s.date,level:s.level},snap:state.inst.snapshot(),hints:s.hints,elapsed:s.elapsed});}
let saveT=null;const saveSoon=()=>{clearTimeout(saveT);saveT=setTimeout(saveCurrent,300);};
function stopPlay(){if(state.inst){saveCurrent();state.inst.destroy();state.inst=null;}clearInterval(state.timer);state.timer=null;}
function startPuzzle(spec,fresh){
  stopPlay();
  state.play=Object.assign({},spec,{hints:0,elapsed:0,done:false});state.view='play';render();window.scrollTo(0,0);
  setTimeout(()=>{
    const T=TYPES[spec.type],data=T.gen(makeRng(spec.type+'|'+spec.diff+'|'+spec.seed),spec.diff);
    const root=document.getElementById('proot');if(!root||state.play.key!==spec.key)return;
    const ctx={changed:saveSoon,solved:onSolved,toast,settings:P.settings,setSetting(k,v){P.settings[k]=v;saveProgress();}};
    state.inst=T.mount(root,data,ctx);
    const cur=lsGet(LSC);
    if(!fresh&&cur&&cur.key===spec.key&&cur.snap){try{state.inst.restore(cur.snap);state.play.hints=cur.hints||0;state.play.elapsed=cur.elapsed||0;updateHud();}catch(e){}}
    state.timer=setInterval(()=>{if(document.hidden||state.play.done)return;state.play.elapsed++;const t=document.getElementById('timer');if(t)t.textContent=fmtTime(state.play.elapsed);if(state.play.elapsed%15===0)saveCurrent();},1000);
  },30);
}
function updateHud(){const s=state.play;const t=document.getElementById('timer');if(t)t.textContent=fmtTime(s.elapsed);const h=document.getElementById('hintcount');if(h)h.textContent=s.hints?`${s.hints} hint${s.hints>1?'s':''} used`:'';}
function onSolved(){
  const s=state.play;if(!s||s.done)return;s.done=true;clearInterval(state.timer);
  let pts=BASE_PTS[s.diff];if(s.hints===0)pts=Math.round(pts*1.5);
  let starsWon=0,first=true;
  if(s.kind==='daily'){first=!P.daily[s.date];if(first){pts+=10;P.daily[s.date]={t:s.elapsed,h:s.hints};}else pts=0;P.bestStreak=Math.max(P.bestStreak,streakNow());}
  if(s.kind==='level'){starsWon=s.hints===0?3:s.hints<=2?2:1;const prev=P.levels[s.level]||0;first=!prev;P.levels[s.level]=Math.max(prev,starsWon);if(!first)pts=0;}
  let coins=EARN_PTS[s.diff];if(s.hints===0)coins=Math.round(coins*1.5);if(s.kind==='daily'&&first)coins+=5;
  P.earned=(P.earned||0)+coins;
  P.xp+=pts;P.solved[s.type]=(P.solved[s.type]||0)+1;
  const before=levelOf(P.xp-pts);saveProgress();lsSet(LSC,null);
  const after=levelOf(P.xp);
  setTimeout(()=>{
    const m=document.getElementById('modal');
    m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="wint"><p class="eyebrow">${TYPES[s.type].name} · ${DLABEL[s.diff]}</p><h2 id="wint">Solved!</h2>
      ${s.kind==='level'?`<div class="big-stars" aria-label="${starsWon} of 3 stars">${stars(starsWon)}</div>`:''}
      <div class="facts"><div><b>${fmtTime(s.elapsed)}</b><span class="muted">time</span></div><div><b>${s.hints}</b><span class="muted">hints</span></div><div><b>+${coins}</b><span class="muted">points</span></div><div><b>+${pts}</b><span class="muted">XP</span></div></div>
      <p class="muted">You have ${balance()} points to spend on hints.</p>
      ${after>before?`<p style="font-weight:700">You reached level ${after}: ${rankName(after)}!</p>`:''}
      ${s.kind==='daily'&&first?`<p class="muted">Streak: ${streakNow()} day${streakNow()===1?'':'s'}. A new puzzle arrives tomorrow.</p>`:''}
      ${!first?`<p class="muted">Replays still earn points, but no XP. Stars can improve.</p>`:''}
      <div class="actions">${s.kind==='level'?`<button class="btn" data-act="level" data-n="${s.level+1}">Next level</button>`:s.kind==='free'?`<button class="btn" data-act="free-start">Another one</button>`:`<button class="btn" data-act="tab" data-v="journey">Go to the journey</button>`}<button class="btn ghost" data-act="tab" data-v="today">Home</button></div></div>`;
    m.hidden=false;m.querySelector('.btn').focus();
  },450);
}

/* ---------- Clicks ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act;
  const closeModal=()=>{document.getElementById('modal').hidden=true;};
  if(act==='tab'){closeModal();stopPlay();state.play=null;state.view=el.dataset.v;render();window.scrollTo(0,0);}
  else if(act==='daily'){closeModal();startPuzzle(dailySpec(el.dataset.date));}
  else if(act==='level'){const n=+el.dataset.n;if(n>maxLevel()+1){toast(`Finish level ${maxLevel()+1} first to unlock this one.`);return;}closeModal();startPuzzle(levelSpec(n));}
  else if(act==='quick'){state.freeType=el.dataset.t;closeModal();startFree();}
  else if(act==='free-type'){state.freeType=el.dataset.t;P.settings.lastType=state.freeType;saveProgress();render();}
  else if(act==='free-diff'){state.freeDiff=el.dataset.d;P.settings.lastDiff=state.freeDiff;saveProgress();render();}
  else if(act==='free-start'){closeModal();startFree();}
  else if(act==='resume'){const cur=lsGet(LSC);if(cur&&cur.spec)startPuzzle(cur.spec);}
  else if(act==='back'){stopPlay();const k=state.play&&state.play.kind;state.play=null;state.view=k==='level'?'journey':k==='free'?'free':'today';render();}
  else if(act==='hint'){if(state.inst&&!state.play.done){
    if(balance()<HINT_COST){toast(`A hint costs ${HINT_COST} points and you have ${balance()}. Solve another puzzle to earn more.`);return;}
    state.play.hints++;P.spent=(P.spent||0)+HINT_COST;
    if(!state.inst.hint()){state.play.hints--;P.spent-=HINT_COST;toast('Nothing left to hint.');}else if(!state.play.done)toast(`Hint used: −${HINT_COST} points. ${balance()} left.`);
    saveProgress();updateHud();saveSoon();}}
  else if(act==='check'){if(state.inst)toast(state.inst.check());}
  else if(act==='restart'){
    if(el.dataset.armed){const s=state.play;lsSet(LSC,null);startPuzzle({type:s.type,diff:s.diff,seed:s.seed,key:s.key,kind:s.kind,date:s.date,level:s.level},true);}
    else{el.dataset.armed='1';el.textContent='Tap again to clear';setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.textContent='Start over';}},3000);}
  }
  else if(act==='reset'){
    if(el.dataset.armed){P=freshProgress();lsSet(LSC,null);saveProgress();render();toast('Progress reset.');}
    else{el.dataset.armed='1';el.textContent='Tap again to erase everything';setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.textContent='Reset all progress';}},3500);}
  }
});
function startFree(){const seed=Date.now().toString(36)+Math.random().toString(36).slice(2,7);startPuzzle({type:state.freeType,diff:state.freeDiff,seed,key:`free:${state.freeType}:${state.freeDiff}:${seed}`,kind:'free'});}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const m=document.getElementById('modal');if(!m.hidden)m.hidden=true;}});
window.addEventListener('pagehide',saveCurrent);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveCurrent();});

render();
initCloud();
</script>

</body></html>
